<div class="page-container">
  <div class="page-header">
    <img src="/android-chrome-512x512.png" alt="Logo" class="header-icon" />
    <h1 class="page-title">Registrieren</h1>
  </div>

  <mat-card appearance="outlined" class="standard-card">
    <mat-card-content>
      <form [formGroup]="registrierungForm" class="auth-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Passwort</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Passwort bestätigen</mat-label>
          <input matInput type="password" formControlName="passwordConfirm" />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Registrieren</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
