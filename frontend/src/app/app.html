<div class="app-container">
  @if (authErrorCode(); as errorCode) {
    <div role="alert" aria-live="assertive">
      <app-info-box variant="error" [title]="'app.auth.loginErrorTitle' | translate">
        <span>{{ errorCode }}: {{ ('app.auth.errors.' + errorCode) | translate }}</span>
      </app-info-box>
    </div>
  }

  <router-outlet></router-outlet>
</div>
