<div class="app-container">
  @if (authErrorCode(); as errorCode) {
    <div role="alert" aria-live="assertive">
      <app-info-box variant="error" [title]="'app.auth.loginErrorTitle' | translate">
        <span>{{ errorCode }}: {{ ('app.auth.errors.' + errorCode) | translate }}</span>
      </app-info-box>
    </div>
  }

  @if (pageTitleKey(); as titleKey) {
    <header class="page-header app-page-header">
      <img src="/android-chrome-512x512.png" alt="Logo" class="header-icon" />
      <h1 class="mat-headline-5">{{ titleKey | translate }}</h1>
    </header>
  }

  <router-outlet></router-outlet>
</div>
