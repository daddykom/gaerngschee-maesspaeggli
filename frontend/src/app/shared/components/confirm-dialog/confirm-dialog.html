<h2 mat-dialog-title>{{ data.title | translate }}</h2>
<mat-dialog-content>{{ data.message | translate }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelLabel | translate }}</button>
  <button mat-flat-button color="warn" type="button" (click)="confirm()">
    {{ data.confirmLabel | translate }}
  </button>
</mat-dialog-actions>
