<div class="page-container">
  <div class="page-header">
    <img src="/android-chrome-512x512.png" alt="Logo" class="header-icon" />
    <h1 class="page-title">Mässpäggli anfragen</h1>
  </div>

  <mat-card appearance="outlined" class="anmeldung-card">
    <mat-card-header>
      <mat-card-title>
        Anmeldeformular geschlossen
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="info-box">
        <mat-icon>info</mat-icon>
        <div class="info-content">
          <p class="intro-text">Liebe Klient*innen</p>
          <p class="body-text">
            Wir freuen uns sehr über das grosse Interesse an unserer Mässpäggli-Aktion
            2025. Aufgrund der zahlreichen Anmeldungen ist das Anmeldeformular leider
            bereits geschlossen.
          </p>
        </div>
      </div>
      <img src="/baj_maess_visual.svg" alt="Mässpäggli" class="hero-image" />

      <mat-tab-group>
        <mat-tab label="Anmelden">
          <form [formGroup]="anmeldungForm" class="auth-form">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email"
                     (blur)="onEmailBlurAnmeldung(anmeldungForm.get('email')?.value)" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Passwort</mat-label>
              <input matInput type="password" formControlName="password" />
            </mat-form-field>
            <button mat-flat-button color="primary" type="submit">Anmelden</button>
          </form>
        </mat-tab>

        <mat-tab label="Registrieren">
          <form [formGroup]="registrierungForm" class="auth-form">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email"
                     (blur)="onEmailBlurRegistrierung(registrierungForm.get('email')?.value)" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Passwort</mat-label>
              <input matInput type="password" formControlName="password" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Passwort bestätigen</mat-label>
              <input matInput type="password" formControlName="passwordConfirm" />
            </mat-form-field>
            <button mat-flat-button color="primary" type="submit">Registrieren</button>
          </form>
        </mat-tab>
      </mat-tab-group>
    </mat-card-content>
  </mat-card>
</div>
