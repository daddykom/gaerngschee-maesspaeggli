<section class="gl-stack gl-stack--group">
  <h2>{{ 'app.passwordReset.heading' | translate }}</h2>
  <form class="gl-stack gl-stack--group" (submit)="$event.preventDefault(); onSubmit()">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ 'app.passwordReset.emailLabel' | translate }}</mat-label>
      <input matInput type="email" autocomplete="username" [formField]="passwordResetForm.email" />
      <app-control-error matError [control]="passwordResetForm.email()" translationPrefix="app.passwordReset.errors.email" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ 'app.passwordReset.newPasswordLabel' | translate }}</mat-label>
      <input matInput type="password" autocomplete="new-password" [formField]="passwordResetForm.newPassword" />
      <app-control-error matError [control]="passwordResetForm.newPassword()" translationPrefix="app.passwordReset.errors.newPassword" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ 'app.passwordReset.confirmationLabel' | translate }}</mat-label>
      <input matInput type="password" autocomplete="new-password" [formField]="passwordResetForm.passwordConfirmation" />
      <app-control-error matError [control]="passwordResetForm.passwordConfirmation()" translationPrefix="app.passwordReset.errors.passwordConfirmation" />
    </mat-form-field>
    <div class="gl-cluster">
      <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
        {{ 'app.passwordReset.submit' | translate }}
      </button>
    </div>
  </form>
</section>
