<section class="gl-stack gl-stack--group">
    <h2>{{ 'app.login.heading' | translate }}</h2>
    <form class="gl-stack gl-stack--group" (submit)="$event.preventDefault(); onSubmit()">
        <div class="auth-field-group">
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>{{ 'app.login.emailLabel' | translate }}</mat-label>
           <input matInput type="email" [formField]="loginForm.email" />
          </mat-form-field>
          <app-control-error
             [control]="loginForm.email()"
            translationPrefix="app.login.errors.email"
          />
        </div>
        <div class="auth-field-group">
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>{{ 'app.login.passwordLabel' | translate }}</mat-label>
           <input matInput type="password" [formField]="loginForm.password" />
          </mat-form-field>
          <app-control-error
             [control]="loginForm.password()"
            translationPrefix="app.login.errors.password"
          />
        </div>
        <button mat-button
          class="forgot-password-link"
          type="button"
          (click)="onForgotPassword()"
        >
          {{ 'app.login.forgotPassword' | translate }}
        </button>
        <div class="gl-cluster">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="loading()"
            [attr.aria-busy]="loading()"
          >
            {{ 'app.login.submit' | translate }}
          </button>
        </div>
    </form>
</section>
