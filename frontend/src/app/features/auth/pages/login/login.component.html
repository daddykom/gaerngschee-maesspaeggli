<div class="page-container">
    <div class="page-header">
        <img src="/android-chrome-512x512.png" alt="Logo" class="header-icon" />
        <h1 class="mat-headline-5">{{ 'app.login.pageTitle' | translate }}</h1>
    </div>

  <mat-card appearance="outlined" class="standard-card">
      <h2>{{ 'app.login.heading' | translate }}</h2>
    <mat-card-content>
      <form [formGroup]="loginForm" class="auth-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'app.login.emailLabel' | translate }}</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>{{ 'app.login.passwordLabel' | translate }}</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="loading()"
          [attr.aria-busy]="loading()"
        >
          {{ 'app.login.submit' | translate }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
